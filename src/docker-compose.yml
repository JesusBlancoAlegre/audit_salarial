version: '3.8'

services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      - SECRET_KEY=super-secret-key-for-local-dev
      - DATABASE_URL=mysql+pymysql://root:rootpassword@db:3306/audit_salarial
      - FLASK_APP=run.py
      - FLASK_ENV=development
    volumes:
      - .:/app
      - uploads_data:/app/uploads
      - logs_data:/app/logs
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=audit_salarial
    volumes:
      - db_data:/var/lib/mysql
      - ../audit.sql:/docker-entrypoint-initdb.d/01-audit.sql
      - ../insertsaudit.sql:/docker-entrypoint-initdb.d/02-inserts.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:
  uploads_data:
  logs_data:
